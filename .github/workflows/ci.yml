name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run sync && bun run check && bun run check:ts && bun run lint && bun run format:check
      - run: node --test scripts/*.test.mjs
      - run: bun run build
      - run: bunx wrangler deploy --env staging --dry-run
      - run: bunx wrangler deploy --env alpha --dry-run
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Read pinned CMS revision
        id: cms
        working-directory: web
        run: node scripts/cms-revision.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: AstrologyEngine/cms
          ref: ${{ steps.cms.outputs.revision }}
          path: cms
          persist-credentials: false
      - run: bun install --frozen-lockfile && bun run contract:build
        working-directory: cms
      - run: bun run sync && bun test verification
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run test:browser
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-results
          path: |
            web/playwright-report/
            web/test-results/
