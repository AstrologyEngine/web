name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run sync && bun run check && bun run check:ts && bun run lint && bun run format:check && bun run check:content
      - run: node --test scripts/*.test.mjs
      - run: bun run build
      - run: bunx wrangler deploy --env staging --dry-run
      - run: bunx wrangler deploy --env alpha --dry-run
