name: Deploy
on:
  workflow_call:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || 'alpha' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  checks:
    if: github.event_name == 'release' && github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
  gate:
    if: github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease)
    runs-on: ubuntu-24.04
    env:
      CMS_DEPLOY_ENABLED: ${{ vars.CMS_DEPLOY_ENABLED }}
    steps:
      - name: Report CMS provisioning gate
        run: |
          if [ "$CMS_DEPLOY_ENABLED" != true ]; then
            echo "CMS deployment is disabled pending [hosted setup #39](https://github.com/AstrologyEngine/web-issues/issues/39)." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = release ]; then
              echo "::error::Alpha release blocked: complete CMS setup #39 and enable CMS_DEPLOY_ENABLED."
              exit 1
            fi
          else
            echo "CMS deployment is enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: vars.CMS_DEPLOY_ENABLED == 'true' && always() && needs.gate.result == 'success' && (github.event_name == 'push' || needs.checks.result == 'success')
    needs: [checks, gate]
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'staging' || 'alpha' }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || 'alpha' }}
      CLOUDFLARE_ACCOUNT_ID: "3fbb5cddaac423e2bcf26805f75138f2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify staging is still current
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run sync && bun run build
        env:
          CMS_SNAPSHOT_ORIGIN: https://cms-${{ env.TARGET }}.astrologyengine.dev
      - run: bunx wrangler deploy --env "$TARGET" --dry-run
      - name: Recheck current staging head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$GITHUB_SHA"
      - run: bunx wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node scripts/smoke.mjs "https://$TARGET.astrologyengine.dev" "$GITHUB_SHA"
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
        env:
          E2E_BASE_URL: https://${{ env.TARGET }}.astrologyengine.dev
      - name: Deployment summary
        if: always()
        run: |
          echo "Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
