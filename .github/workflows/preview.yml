name: PR preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  deployments: write
  pull-requests: read
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_ACCOUNT_ID: "3fbb5cddaac423e2bcf26805f75138f2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect current PR
        id: current
        run: |
          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          echo "state=$(jq -r .state /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head.sha /tmp/pr.json)" >> "$GITHUB_OUTPUT"
      - name: Remove closed preview
        if: steps.current.outputs.state == 'closed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/preview-cleanup.mjs
          gh api "repos/$REPO/deployments?environment=pr-$PR" --paginate --jq '.[].id' | while read -r id; do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive
          done
      - name: Build and deploy
        id: deploy
        if: steps.current.outputs.state == 'open' && steps.current.outputs.sha == env.HEAD_SHA
        run: |
          id=$(jq -n --arg ref "$HEAD_SHA" --arg environment "pr-$PR" '{ref:$ref,environment:$environment,auto_merge:false,required_contexts:[],transient_environment:true,production_environment:false}' | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=in_progress
          bun run sync
          bun run build
      - name: Upload preview
        id: upload
        if: steps.deploy.outputs.id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          gh api "repos/$REPO/pulls/$PR" > /tmp/latest-pr.json
          test "$(jq -r .state /tmp/latest-pr.json)" = open
          test "$(jq -r .head.sha /tmp/latest-pr.json)" = "$HEAD_SHA"
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/astrology-engine-web-staging/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":false,"previews_enabled":true}' | jq -e '.success == true'
          WRANGLER_OUTPUT_FILE_PATH=/tmp/preview.ndjson bunx wrangler preview --env staging --name "pr-$PR" --ignore-base-config
          url=$(jq -ser 'map(select(.type == "preview")) | last | .preview_urls[0] | select(startswith("https://"))' /tmp/preview.ndjson)
          immutable=$(jq -ser 'map(select(.type == "preview")) | last | .deployment_urls[0] | select(startswith("https://"))' /tmp/preview.ndjson)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
      - name: Verify readiness
        if: steps.upload.outputs.immutable != ''
        run: node scripts/smoke.mjs '${{ steps.upload.outputs.immutable }}' "$HEAD_SHA"
      - name: Finalize deployment
        if: always() && steps.deploy.outputs.id != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'inactive' || 'failure' }}
        run: |
          gh api -X POST "repos/$REPO/deployments/${{ steps.deploy.outputs.id }}/statuses" -f state="$STATE" -f environment_url="$URL" -f log_url="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
      - run: bunx playwright install --with-deps chromium
        if: steps.upload.outputs.immutable != '' && success()
      - name: E2E
        if: steps.upload.outputs.immutable != '' && success()
        env:
          E2E_BASE_URL: ${{ steps.upload.outputs.immutable }}
        run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ github.event.number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Reconcile closure after deployment
        if: always() && steps.upload.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          if [ "$state" = closed ]; then
            node scripts/preview-cleanup.mjs
            gh api "repos/$REPO/deployments?environment=pr-$PR" --paginate --jq '.[].id' | while read -r id; do
              gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive
            done
          fi
